# Sert l'application Angular et transmet les appels d'API au backend Django.
server {
    listen 80;
    server_name _;
    # N'indique pas la version de nginx dans les réponses
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Import Excel et photos : 5 Mo maximum côté serveur, plus l'enveloppe multipart
    client_max_body_size 6m;

    # En-têtes de sécurité (aucun add_header dans les blocs location,
    # sinon ceux-ci ne seraient plus envoyés)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Réglages communs aux routes transmises au backend
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Analyse IA et OCR : jusqu'à plusieurs dizaines de secondes
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ^~ /api/    { proxy_pass http://backend:8000; }
    location ^~ /ocr/    { proxy_pass http://backend:8000; }
    # Admin Django : jamais à travers ngrok. Sa page de connexion n'a ni limite
    # de tentatives ni verrouillage, et le mot de passe d'un compte est son PIN.
    # Utilisable depuis la machine : http://localhost:8080/admin/
    location ^~ /admin/ {
        if ($host ~* "\.ngrok(-free)?\.(dev|app|io)$") {
            return 404;
        }
        proxy_pass http://backend:8000;
    }
    location ^~ /static/ { proxy_pass http://backend:8000; }

    # Logos envoyés : lus directement dans le volume partagé avec le backend
    # (Django ne les sert pas avec DEBUG=False). ^~ : prioritaire sur la règle
    # des images ci-dessous. Noms aléatoires, nouveaux à chaque changement :
    # mise en cache longue sans risque.
    # /media/ est réservé au backend : le build Angular range ses propres
    # fichiers (polices d'icônes) dans /ressources/ (angular.json, outputPath.media)
    location ^~ /media/ {
        alias /srv/media/;
        expires 30d;
    }

    # Fichiers de l'application : noms avec empreinte, mis en cache longtemps
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Navigation Angular : toute autre adresse renvoie index.html,
    # ce qui permet d'actualiser n'importe quelle page (ex. /paiement/annule)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
