<!-- TOPBAR DESKTOP -->
<header class="h-20 px-10 bg-white/70 border-b border-white/30 backdrop-blur-[10px] hidden lg:flex items-center justify-between fixed top-0 left-[264px] right-0 z-40">
  <h1 class="text-[#1E3A5F] text-2xl font-bold leading-8">{{ titre }}</h1>
  <div class="flex items-center gap-8">
    <!-- Recherche -->
    <div class="relative">
      <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-[#1E3A5F]/40 text-sm"></i>
      <input type="text" placeholder="Rechercher..."
        class="w-64 pl-10 pr-4 py-[9px] bg-[#1E3A5F]/5 rounded-full text-sm text-gray-400 outline-none" />
    </div>
    <!-- Actions -->
    <div class="flex items-center gap-4">
      <!-- Notif -->
      <div class="relative w-10 h-10 flex items-center justify-center">
        <i class="pi pi-bell text-[#1E3A5F]/60 text-lg"></i>
        <div class="absolute top-2 right-2 w-2 h-2 bg-[#C1654A] rounded-full border-2 border-white"></div>
      </div>
      <div class="w-px h-8 bg-[#1E3A5F]/10"></div>
      <!-- Profil -->
      <div class="flex items-center gap-3">
        <div class="flex flex-col items-end">
          <span class="text-[#1E3A5F] text-sm font-bold leading-5">{{ nomComplet() }}</span>
          <span class="text-[#2E7D5B] text-[10px] font-bold uppercase tracking-[0.5px]">{{ utilisateur()?.role }}</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-[#2E7D5B]/20 flex items-center justify-center border-2 border-white shadow-sm">
          <span class="text-[#2E7D5B] text-sm font-bold">{{ initiales() }}</span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- TOPBAR MOBILE -->
<header class="flex lg:hidden h-16 px-4 bg-white items-center justify-between sticky top-0 z-40 shadow-sm">
  <img src="images/logo-sunu-gestion.png" alt="SunuGestion" class="h-7 w-auto" />
  <div class="flex items-center gap-3">
    <button class="w-9 h-9 flex items-center justify-center">
      <i class="pi pi-search text-[#1E3A5F] text-lg"></i>
    </button>
    <div class="w-9 h-9 rounded-full bg-[#2E7D5B]/20 flex items-center justify-center border-2 border-white shadow-sm">
      <span class="text-[#2E7D5B] text-xs font-bold">{{ initiales() }}</span>
    </div>
  </div>
</header>
