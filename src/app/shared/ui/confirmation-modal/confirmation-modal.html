<div
  class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4"
  (click)="demanderAnnulation()"
>
  <div
    class="w-full max-w-[420px] rounded-2xl bg-white p-6 shadow-2xl"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="flex justify-center mb-4">
      <div
        class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl"
        [class]="danger() ? 'bg-[#C1654A]/10 text-[#C1654A]' : 'bg-[#2E7D5B]/10 text-[#2E7D5B]'"
      >
        <i class="pi" [class]="danger() ? 'pi-exclamation-triangle' : 'pi-check-circle'"></i>
      </div>
    </div>

    <h2 class="text-center text-lg font-bold text-[#1E3A5F]">{{ titre() }}</h2>
    <p class="mt-2 text-center text-sm text-[#4A5568]">{{ message() }}</p>

    @if (erreur()) {
      <div class="mt-4 rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700" role="alert">
        {{ erreur() }}
      </div>
    }

    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row">
      <button
        type="button"
        (click)="demanderAnnulation()"
        [disabled]="enCours()"
        class="flex-1 rounded-xl border border-[#1E3A5F]/20 bg-white py-3 text-sm font-semibold text-[#1E3A5F] disabled:opacity-50"
      >
        Annuler
      </button>
      <button
        type="button"
        (click)="confirmer.emit()"
        [disabled]="enCours()"
        class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl py-3 text-sm font-semibold text-white disabled:opacity-60"
        [class]="danger() ? 'bg-[#C1654A]' : 'bg-[#2E7D5B]'"
      >
        @if (enCours()) { <i class="pi pi-spin pi-spinner"></i> }
        {{ libelleConfirmer() }}
      </button>
    </div>
  </div>
</div>
