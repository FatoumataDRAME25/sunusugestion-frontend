<!-- Panneau droit : le formulaire, toujours visible -->
<div class="flex-1 flex items-center justify-center bg-blanc-lait p-6 md:p-20">

  <div
    class="w-full max-w-[576px] bg-white rounded-[32px] border border-[#E2E5EA] shadow-[0_8px_10px_-6px_rgba(0,0,0,0.10),0_20px_25px_-5px_rgba(0,0,0,0.10)] p-8 md:p-16"
  >

    <!-- En-tête -->
    <div class="flex flex-col gap-2 mb-10">

      <h2
        class="font-sans font-bold text-[36px] leading-[45px] text-anthracite"
      >
        Bienvenue sur<br />
        SunuGestion
      </h2>

      <p
        class="font-sans text-[18px] leading-7 text-[#4A5568]"
      >
        Connectez-vous à votre espace
      </p>

    </div>

    @if (authService.errorMessage()) {
      <p-message
        severity="error"
        [text]="authService.errorMessage()!"
        styleClass="mb-8 w-full"
      />
    }

    <form
      (ngSubmit)="seConnecter()"
      class="flex flex-col gap-8"
    >

      <!-- Identifiant -->
      <div class="flex flex-col gap-3">

        <label
          class="font-sans text-sm leading-5 font-semibold text-anthracite"
        >
          Identifiant ou numéro de téléphone
        </label>

        <p-iconfield class="w-full">
          <p-inputicon
            styleClass="pi pi-user text-[#4A5568]"
          />

          <input
            type="text"
            pInputText
            [(ngModel)]="telephone"
            name="telephone"
            placeholder="Exemple : 77 XXX XX XX"
            class="w-full !h-16 !bg-[#F7F8FA] !border !border-[#E2E5EA] !rounded-xl !text-[18px] !text-anthracite"
            required
          />
        </p-iconfield>

      </div>

      <!-- Mot de passe -->
      <div class="flex flex-col gap-3">

        <div class="flex justify-between items-center">

          <label
            class="font-sans text-sm leading-5 font-semibold text-anthracite"
          >
            Mot de passe
          </label>

          <a
            class="font-sans text-sm leading-5 font-semibold text-bleu-nuit cursor-pointer"
          >
            Mot de passe oublié ?
          </a>

        </div>

        <p-password
          [(ngModel)]="codePin"
          name="codePin"
          placeholder="••••••••"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="!h-16 !w-full !bg-[#F7F8FA] !border !border-[#E2E5EA] !rounded-xl !text-[18px]"
        />

      </div>

      <!-- Bouton -->
      <p-button
        type="submit"
        label="Se connecter"
        icon="pi pi-sign-in"
        iconPos="right"
        styleClass="!w-full !h-16 !bg-bleu-nuit !border-bleu-nuit !rounded-xl !text-[18px] !font-bold"
        [loading]="authService.isLoading()"
      />

    </form>

  </div>
</div>


</div>
